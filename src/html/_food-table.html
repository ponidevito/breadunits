<section id="food-table" class="container" aria-labelledby="table-title">
  <div class="section-head" data-reveal>
    <h2 id="table-title" data-i18n="table.h2">Таблиця хлібних одиниць</h2>
    <p data-i18n="table.lead">Орієнтовна кількість продукту, що містить одну хлібну одиницю, та вуглеводи на 100 г.</p>
    <p class="table-note" data-i18n="table.note">*Значення в таблиці — приблизні довідкові цифри й можуть відрізнятися
      залежно від сорту та способу приготування продукту.</p>
  </div>

  <div class="table-controls" data-reveal>
    <div class="table-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <input type="search" id="table-search" autocomplete="off"
        data-i18n-attr="placeholder:table.search,aria-label:table.search.label" placeholder="Пошук продукту…"
        aria-label="Пошук продукту в таблиці">
    </div>
    <div class="table-filter" role="group" aria-label="Categories"></div>
  </div>

  <div class="table-wrap" data-reveal>
    <table class="food-table">
      <thead>
        <tr>
          <th scope="col" data-i18n="table.col.product">Продукт</th>
          <th scope="col" data-i18n="table.col.amount">Кількість на 1 ХО</th>
          <th scope="col" data-i18n="table.col.carbs">Вуглеводи / 100 г</th>
          <th scope="col"><span class="visually-hidden">Actions</span></th>
        </tr>
      </thead>
      <tbody id="food-tbody"></tbody>
    </table>
  </div>
  <div class="table-more" data-reveal>
    <button class="btn btn--ghost table-more__button" id="table-toggle" type="button" aria-controls="food-tbody"
      aria-expanded="false" data-i18n="table.expand">Показати більше</button>
  </div>

</section>
