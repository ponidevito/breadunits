<!-- Bottom "get the app" bar. Shown by main.js (initAppBanner) after 3.2 s,
     hidden for good once closed (localStorage "buc-app-banner"). -->
<aside class="app-banner" id="app-banner" hidden data-i18n-attr="aria-label:app.banner.aria" aria-label="Android-додаток">
  <div class="app-banner__inner container">
    <img class="app-banner__icon" src="/img/logo.png" alt="" width="44" height="44">
    <div class="app-banner__text">
      <strong data-i18n="app.banner.title">Завантажити додаток</strong>
      <span data-i18n="app.banner.text">Калькулятор хлібних одиниць для Android</span>
    </div>
    <a class="store-badge store-badge--sm" id="app-banner-link"
       href="https://play.google.com/store/apps/details?id=com.diacalc.app"
       target="_blank" rel="noopener"
       data-i18n-attr="aria-label:app.cta.aria" aria-label="Завантажити в Google Play">
      <svg class="store-badge__logo" viewBox="0 0 24 26" aria-hidden="true">
        <path fill="#00d7fe" d="M.6.5C.2.9 0 1.5 0 2.3v21.4c0 .8.2 1.4.6 1.8l.1.1L12.7 13.6v-.3L.7.4z"/>
        <path fill="#ffce00" d="m16.7 17.6-4-4v-.3l4-4 .1.1 4.7 2.7c1.4.8 1.4 2 0 2.8l-4.7 2.7z"/>
        <path fill="#ff3a44" d="m16.8 17.5-4.1-4.1L.6 25.5c.4.5 1.2.5 2 .1z"/>
        <path fill="#00f076" d="M16.8 9.4 2.6 1.3C1.8.9 1 .9.6 1.4l12.1 12z"/>
      </svg>
      <span class="store-badge__text">
        <small data-i18n="app.cta.small">Завантажуйте в</small>
        <span>Google Play</span>
      </span>
    </a>
    <button type="button" class="app-banner__close" id="app-banner-close"
            data-i18n-attr="aria-label:app.banner.close" aria-label="Закрити">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
</aside>
