<!DOCTYPE html>
<html lang="@@htmlLang" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@@title</title>
  <meta name="description" content="@@description">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#0f9d8f">
  <meta name="color-scheme" content="light dark">

  <link rel="canonical" href="@@canonical">
  <link rel="alternate" hreflang="uk" href="https://breadunits.top/@@page/">
  <link rel="alternate" hreflang="en" href="https://breadunits.top/en/@@page/">
  <link rel="alternate" hreflang="es" href="https://breadunits.top/es/@@page/">
  <link rel="alternate" hreflang="x-default" href="https://breadunits.top/@@page/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Diabetes Calculator">
  <meta property="og:title" content="@@title">
  <meta property="og:description" content="@@description">
  <meta property="og:url" content="@@canonical">
  <meta property="og:locale" content="@@ogLocale">
  <meta property="og:image" content="https://breadunits.top/img/breadunits-banner.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1536">
  <meta property="og:image:height" content="1024">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="@@title">
  <meta name="twitter:description" content="@@description">
  <meta name="twitter:image" content="https://breadunits.top/img/breadunits-banner.png">

  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/favicon-180.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  @@if (htmlLang === 'uk') {
  <link rel="preload" href="/fonts/inter-cyrillic-var.woff2" as="font" type="font/woff2" crossorigin>
  }
  <link rel="stylesheet" href="/css/style.min.css?v=4">

  <script>
    // Set theme before first paint to avoid a flash.
    (function () {
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("buc-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { }
    })();
  </script>
</head>
<body>
  <div class="wrapper">
  @@if (htmlLang === 'en') {
  <a class="skip-link" href="#main-content">Skip to main content</a>
  }
  @@if (htmlLang === 'es') {
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
  }
  @@if (htmlLang === 'uk') {
  <a class="skip-link" href="#main-content">Перейти до основного вмісту</a>
  }

    @@include('_header.html', {"legal": true, "root": "@@root"})

    <main class="main legal-page container" id="main-content">
