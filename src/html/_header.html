<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="/">
      <img src="/img/logo.png" alt="Logo">
      <span>Diabetes Calculator</span>
    </a>
    <div class="site-header__spacer"></div>

    <nav class="nav" id="primary-nav" aria-label="Main">
      <a href="#calculator" data-i18n="nav.calculator">Калькулятор</a>
      <a href="#how-it-works" data-i18n="nav.how">Як це працює</a>
      <a href="#food-table" data-i18n="nav.table">Таблиця продуктів</a>
      <a href="#faq" data-i18n="nav.faq">Питання</a>
    </nav>

    <div class="header-tools">
      <div class="lang-switch" id="lang-switch">
        <button type="button" class="lang-switch__toggle" id="lang-toggle"
                aria-haspopup="listbox" aria-expanded="false"
                data-i18n-attr="aria-label:lang.label" aria-label="Мова">
          <span class="lang-switch__flag" id="lang-current-flag" aria-hidden="true">
            <svg viewBox="0 0 20 14"><rect width="20" height="7" fill="#005BBB"/><rect y="7" width="20" height="7" fill="#FFD500"/></svg>
          </span>
          <span class="lang-switch__code" id="lang-current-code">UA</span>
          <svg class="lang-switch__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <ul class="lang-switch__menu" id="lang-menu" role="listbox"
            data-i18n-attr="aria-label:lang.label" aria-label="Мова">
          <li class="lang-switch__option" role="option" data-lang="uk" aria-selected="true" tabindex="-1">
            <span class="lang-switch__flag" aria-hidden="true"><svg viewBox="0 0 20 14"><rect width="20" height="7" fill="#005BBB"/><rect y="7" width="20" height="7" fill="#FFD500"/></svg></span>
            <span class="lang-switch__name">Українська</span>
            <svg class="lang-switch__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
          </li>
          <li class="lang-switch__option" role="option" data-lang="en" aria-selected="false" tabindex="-1">
            <span class="lang-switch__flag" aria-hidden="true"><svg viewBox="0 0 20 14"><rect width="20" height="14" fill="#012169"/><path d="M0 0L20 14M20 0L0 14" stroke="#fff" stroke-width="2.8"/><path d="M0 0L20 14M20 0L0 14" stroke="#C8102E" stroke-width="1.2"/><rect x="8" width="4" height="14" fill="#fff"/><rect y="5" width="20" height="4" fill="#fff"/><rect x="8.8" width="2.4" height="14" fill="#C8102E"/><rect y="5.8" width="20" height="2.4" fill="#C8102E"/></svg></span>
            <span class="lang-switch__name">English</span>
            <svg class="lang-switch__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
          </li>
          <li class="lang-switch__option" role="option" data-lang="es" aria-selected="false" tabindex="-1">
            <span class="lang-switch__flag" aria-hidden="true"><svg viewBox="0 0 20 14"><rect width="20" height="14" fill="#AA151B"/><rect y="3.5" width="20" height="7" fill="#F1BF00"/></svg></span>
            <span class="lang-switch__name">Español</span>
            <svg class="lang-switch__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
          </li>
        </ul>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-pressed="false"
              data-i18n-attr="aria-label:theme.toggle" aria-label="Змінити тему">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="primary-nav"
              data-i18n-attr="aria-label:nav.menu" aria-label="Меню">
        <span aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
