<!-- Android app promo. -->
<section id="android-app" class="container" aria-labelledby="app-title">
  <div class="app-promo">
    <div class="app-promo__text" data-reveal>
      <span class="eyebrow" data-i18n="app.eyebrow">Android-додаток</span>
      <h2 id="app-title" data-i18n="app.h2">Калькулятор ХО у вашому телефоні</h2>
      <p class="app-promo__lead" data-i18n="app.text">Калькулятор ХО в мобільному додатку.</p>

      <ul class="app-promo__list">
        <li>
          <strong data-i18n="app.f1.title">167 продуктів</strong>
          <span data-i18n="app.f1.text">з вуглеводами та глікемічним індексом</span>
        </li>
        <li>
          <strong data-i18n="app.f2.title">10 або 12 г</strong>
          <span data-i18n="app.f2.text">норма на 1 ХО — як радить ваш лікар</span>
        </li>
        <li>
          <strong data-i18n="app.f3.title">Без реєстрації</strong>
          <span data-i18n="app.f3.text">дані залишаються на пристрої</span>
        </li>
      </ul>

      <a class="store-badge" id="google-play-link"
         href="https://play.google.com/store/apps/details?id=com.diacalc.app"
         target="_blank" rel="noopener"
         data-i18n-attr="aria-label:app.cta.aria" aria-label="Завантажити в Google Play">
        <svg class="store-badge__logo" viewBox="0 0 24 26" aria-hidden="true">
          <path fill="#00d7fe" d="M.6.5C.2.9 0 1.5 0 2.3v21.4c0 .8.2 1.4.6 1.8l.1.1L12.7 13.6v-.3L.7.4z"/>
          <path fill="#ffce00" d="m16.7 17.6-4-4v-.3l4-4 .1.1 4.7 2.7c1.4.8 1.4 2 0 2.8l-4.7 2.7z"/>
          <path fill="#ff3a44" d="m16.8 17.5-4.1-4.1L.6 25.5c.4.5 1.2.5 2 .1z"/>
          <path fill="#00f076" d="M16.8 9.4 2.6 1.3C1.8.9 1 .9.6 1.4l12.1 12z"/>
        </svg>
        <span class="store-badge__text">
          <small data-i18n="app.cta.small">Завантажуйте в</small>
          <span>Google Play</span>
        </span>
      </a>
    </div>

    <div class="app-promo__visual" data-reveal="2">
      <figure class="app-shots">
        <img class="app-shots__img app-shots__img--back" src="/img/app-screen-3.webp" alt="Скриншот додатка: результат розрахунку та глікемічний індекс" loading="lazy" decoding="async" width="282" height="592" data-i18n-attr="alt:app.shot3.alt">
        <img class="app-shots__img app-shots__img--mid" src="/img/app-screen-2.webp" alt="Скриншот додатка: вибір продукту та ваги порції" loading="lazy" decoding="async" width="266" height="592" data-i18n-attr="alt:app.shot2.alt">
        <img class="app-shots__img app-shots__img--front" src="/img/app-screen-1.webp" alt="Скриншот додатка: головний екран калькулятора хлібних одиниць" loading="lazy" decoding="async" width="279" height="592" data-i18n-attr="alt:app.shot1.alt">
      </figure>
    </div>
  </div>
</section>
